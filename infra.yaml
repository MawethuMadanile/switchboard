AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CloudTask infrastructure — DynamoDB table, SNS topic, CloudWatch log
  group, and networking (VPC, subnets, security group) for future
  container workloads.

Parameters:
  TableName:
    Type: String
    Default: cloudTaskTasks
  TopicName:
    Type: String
    Default: CloudTaskReminders
  LogGroupName:
    Type: String
    Default: /cloudtask/cli
  ImageUri:
    Type: String
    Default: 472706939265.dkr.ecr.us-east-1.amazonaws.com/cloudtask:latest

Resources:
  TasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: task_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: task_id
          KeyType: RANGE

  RemindersTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Ref TopicName

  CliLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Ref LogGroupName
      RetentionInDays: 30

  CloudTaskVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: cloudtask-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: cloudtask-igw

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref CloudTaskVPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref CloudTaskVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: cloudtask-public-subnet

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref CloudTaskVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: cloudtask-private-subnet

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref CloudTaskVPC
      Tags:
        - Key: Name
          Value: cloudtask-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for CloudTask ECS tasks
      VpcId: !Ref CloudTaskVPC
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: cloudtask-service-sg
    
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: cloudtask-cluster

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cloudtask-task-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cloudtask-task-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: cloudtask-task-permissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource: !GetAtt TasksTable.Arn
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref RemindersTopic
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${CliLogGroup.Arn}:*"

  NotifyTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: cloudtask-notify
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: cloudtask
          Image: !Ref ImageUri
          Command: ["notify"]
          Environment:
            - Name: CLOUD_REGION
              Value: !Ref AWS::Region
            - Name: CLOUDTASK_TABLE
              Value: !Ref TableName
            - Name: CLOUDTASK_SNS_TOPIC_ARN
              Value: !Ref RemindersTopic
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: notify

  EventBridgeInvokeEcsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cloudtask-eventbridge-ecs-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: cloudtask-eventbridge-run-task
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Ref NotifyTaskDefinition
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt TaskExecutionRole.Arn
                  - !GetAtt TaskRole.Arn

  NotifyScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: cloudtask-notify-schedule
      ScheduleExpression: rate(1 hour)
      State: ENABLED
      Targets:
        - Id: cloudtask-notify-target
          Arn: !GetAtt EcsCluster.Arn
          RoleArn: !GetAtt EventBridgeInvokeEcsRole.Arn
          EcsParameters:
            TaskDefinitionArn: !Ref NotifyTaskDefinition
            TaskCount: 1
            LaunchType: FARGATE
            NetworkConfiguration:
              AwsVpcConfiguration:
                Subnets:
                  - !Ref PublicSubnet
                SecurityGroups:
                  - !Ref ServiceSecurityGroup
                AssignPublicIp: ENABLED

Outputs:
  TableName:
    Value: !Ref TasksTable
  TopicArn:
    Value: !Ref RemindersTopic
  LogGroupName:
    Value: !Ref CliLogGroup
  VpcId:
    Value: !Ref CloudTaskVPC
  PublicSubnetId:
    Value: !Ref PublicSubnet
  PrivateSubnetId:
    Value: !Ref PrivateSubnet
  ServiceSecurityGroupId:
    Value: !Ref ServiceSecurityGroup
    EcsClusterName:
    Value: !Ref EcsCluster
  NotifyTaskDefinitionArn:
    Value: !Ref NotifyTaskDefinition